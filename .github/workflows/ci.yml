name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  QT_VERSION_LATEST: "6.10.*"   # keep in step with the newest Qt the app is developed against
  QT_VERSION_MIN: "6.8.*"       # minimum supported LTS

jobs:
  check:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        qt: ["6.8.*", "6.10.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: ""
          cache: true
      - name: Linux build tools (cxx-qt does not link with GNU ld.bfd)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold libgl1-mesa-dev libxkbcommon-dev python3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (UI self-test runs headless on the offscreen platform)
        run: cargo test --workspace
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Endpoint manifest is current and every endpoint has a UI path
        run: |
          cargo xtask endpoints --check
          cargo xtask coverage
      - name: QML lint
        if: runner.os == 'Linux'
        run: qmllint -I target/debug/build crates/qbt-qt/qml/*.qml || true   # report-only until the import path is wired up
      - name: Release build links only LGPL Qt modules
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p qbremote --no-default-features
          tools/check-qt-modules.sh target/release/qbremote

  # Live contract tests against the official image, one job per supported server line.
  contract:
    name: contract / qBittorrent ${{ matrix.server }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        server: ["5.0.5-1", "5.1.4-2", "latest", "alpha"]   # all pass locally (WebAPI 2.11.2 / 2.11.4 / 2.16.2 / 2.17)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mold
      - run: cargo xtask contract --server ${{ matrix.server }}
