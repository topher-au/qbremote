[package]
name = "qbremote"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
qbt-qt = { version = "0.1.0", path = "../qbt-qt" }

[features]
# Development/CI default: enables the UI self-test hooks. Release builds use `--no-default-features`.
default = ["test-hooks"]
test-hooks = ["qbt-qt/test-hooks"]
