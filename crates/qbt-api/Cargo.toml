[package]
name = "qbt-api"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "multipart", "json", "rustls", "gzip", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
url = "2.5.9"

[dev-dependencies]
qbt-sync = { path = "../qbt-sync" }
wiremock = "0.6.5"
