[package]
name = "qbt-qt"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
qbt-api = { version = "0.1.0", path = "../qbt-api" }
qbt-core = { version = "0.1.0", path = "../qbt-core" }
qbt-sync = { version = "0.1.0", path = "../qbt-sync" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"

[dev-dependencies]
serde_json = "1.0.154"

[features]
# Links Qt Test and enables the model-tester hook used by the UI self-test. Leave off for releases.
test-hooks = []
